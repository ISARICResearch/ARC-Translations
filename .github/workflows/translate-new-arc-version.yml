on:
  repository_dispatch:
    types: [arc-updated]  
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install git+https://github.com/ISARICResearch/BRIDGE.git

      - name: Get latest ARC version path
        id: get_version
        run: python code/get_version_path.py

      - name: Translate most recent ARC
        run: python code/main.py --arc-version=${{ steps.get_version.outputs.version }}

      - name: Run translation tests
        run: pytest code/tests/test_arc_translations.py --arc-version=${{ steps.get_version.outputs.version }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Add machine translations for ARC ${{ steps.get_version.outputs.version }}"
          git push

  ping-link:
    runs-on: ubuntu-latest
    needs: translate
    if: github.actor != 'aidanmarler' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger LINK update
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.LINK_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/aidanmarler/LINK/dispatches \
            -d '{"event_type": "arc-translations-updated"}'